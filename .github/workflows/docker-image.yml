name: Docker Image CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # built with the Go version from go.mod, release binaries may predate it
          install-mode: goinstall
      - name: Test
        run: go test -race -count=1 ./...

  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      # pull requests (including ones from forks, which have no access to secrets) only check that the image builds
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract GitHub tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: ${{ env.PUSH == 'true' }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            tess1o/go-ecoflow-exporter:latest
            tess1o/go-ecoflow-exporter:${{ env.GIT_TAG || github.sha }}
