// Energy strategy operating mode (Self-Powered / Scheduled / TOU)
message EnergyStrategyOperateMode {
  optional int32 operate_self_powered_open = 1;         // Self-powered mode enabled (0/1)
  optional int32 operate_scheduled_open = 2;            // Scheduled mode enabled (0/1)
  optional int32 operate_tou_mode_open = 3;             // TOU mode enabled (0/1)
}

// CMS heartbeat report - cmd_func=32, cmd_id=2
// Upstream declares the signed fields as sint32, but captured data only decodes sensibly as int32
message CMSHeartBeatReport {
  optional CMSStatus1 msg32_2_1 = 1;
  optional CMSStatus2 msg32_2_2 = 2;
}

message CMSStatus1 {
  optional int32 cms_status_misc1 = 1;
  optional int32 cms_status_misc2 = 2;
  optional int32 cms_status_misc3 = 3;
  optional int32 cms_batt_vol_mv = 4;                  // Battery voltage (mV)
  optional uint32 cms_chg_req_amp_ma = 5;               // Charge request current (mA)
  optional int32 cms_status_misc4 = 6;
  optional uint32 cms_max_chg_soc = 7;                  // Max charge SOC (%)
  optional uint32 cms_min_dsg_soc = 8;                  // Min discharge SOC (%)
  optional uint32 cms_batt_soc_int = 9;                 // Battery SOC (%), integer (upstream calls it ac_out_freq, but it tracks cms_batt_soc)
  optional int32 cms_status_misc5 = 10;
  optional int32 cms_status_misc6 = 11;
  optional uint32 cms_chg_rem_time = 12;                // Charge remaining time (min)
  optional uint32 cms_dsg_rem_time = 13;                // Discharge remaining time (min)
  optional int32 cms_chg_dsg_state = 14;               // Charge/discharge state
  optional float cms_batt_soc = 15;                     // Battery SOC (%)
  repeated int32 bms_is_conn_state = 16;               // BMS connection states
  optional int32 cms_status_misc7 = 17;
  optional int32 cms_status_misc8 = 18;
  optional int32 cms_status_misc9 = 19;
  optional int32 cms_status_misc10 = 20;
  optional int32 cms_status_misc11 = 21;
  optional int32 cms_status_misc12 = 22;
  optional uint32 cms_oil_off_soc = 23;                 // Generator auto-off SOC
}

message CMSStatus2 {
  optional int32 cms_status_misc13 = 1;
  optional int32 cms_status_misc14 = 2;
  optional int32 cms_status_misc15 = 3;
  optional int32 cms_status_misc16 = 4;
  optional int32 cms_status_misc17 = 5;
}

