services:
  go_ecoflow_exporter:
    image: tess1o/go-ecoflow-exporter:latest
    container_name: go_ecoflow_exporter
    ports:
      - 2112:2112
    restart: unless-stopped
    environment:
      EXPORTER_TYPE: ${EXPORTER_TYPE}
      ECOFLOW_ACCESS_KEY: ${ECOFLOW_ACCESS_KEY}
      ECOFLOW_SECRET_KEY: ${ECOFLOW_SECRET_KEY}
      ECOFLOW_EMAIL: ${ECOFLOW_EMAIL}
      ECOFLOW_PASSWORD: ${ECOFLOW_PASSWORD}
      ECOFLOW_DEVICES: ${ECOFLOW_DEVICES}
      ECOFLOW_DEVICES_PRETTY_NAMES: ${ECOFLOW_DEVICES_PRETTY_NAMES}
      MQTT_DEVICE_OFFLINE_THRESHOLD_SECONDS: ${MQTT_DEVICE_OFFLINE_THRESHOLD_SECONDS}
      PROTOBUF_DEBUG: ${PROTOBUF_DEBUG}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED}
      METRIC_PREFIX: ${METRIC_PREFIX}
      TIMESCALE_ENABLED: ${TIMESCALE_ENABLED}
      TIMESCALE_URL: ${TIMESCALE_URL}
      REDIS_ENABLED: ${REDIS_ENABLED}
      REDIS_URL: ${REDIS_URL}
      REDIS_DB: ${REDIS_DB}
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # optional, empty keeps the default behaviour (see docker-compose/.env)
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      HANDLER_UNHEALTHY_AFTER_SECONDS: ${HANDLER_UNHEALTHY_AFTER_SECONDS:-}
      TIMESCALE_COMPRESSION_AFTER_DAYS: ${TIMESCALE_COMPRESSION_AFTER_DAYS:-}
      TIMESCALE_RETENTION_DAYS: ${TIMESCALE_RETENTION_DAYS:-}
      TIMESCALE_MIN_WRITE_INTERVAL_SECONDS: ${TIMESCALE_MIN_WRITE_INTERVAL_SECONDS:-}
      REDIS_RETENTION_DAYS: ${REDIS_RETENTION_DAYS:-}
      REDIS_MIN_WRITE_INTERVAL_SECONDS: ${REDIS_MIN_WRITE_INTERVAL_SECONDS:-}
      REDIS_TIMESTAMP_MS: ${REDIS_TIMESTAMP_MS:-}
